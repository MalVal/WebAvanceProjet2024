<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SuperGameLauncher</title>
    <link rel="stylesheet" href="src/CSS/stylelogInSignUp.css">
    <link rel="stylesheet" href="src/CSS/style.css">

    <script defer src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script defer src="./src/JS/main.js"></script>

</head>

<body>

<header>

    <div class="logo">
        <a href="./index.html"><img src="./Image/SuperGameLauncher.png" alt="SuperGameLauncher" id="SuperGameLauncher"></a>
    </div>
    <div>
        <p id="pHello"></p>
    </div>
    <div class="head">
        <a href="#" id="showLoginForm"><img src="./Image/Unknow.png" alt="UnknowLog" id="Unknow"></a>
    </div>

</header>

<main>

    <div id="gallery" class="blur gallery">
        <div class="row">
            <div class="column">
                <div class="game">
                    <a href="./Games/BusterGhost/BusterGhost.html"><img src="./Image/BusterGhost.png" alt="BusterGhost" data-original-src="./Image/BusterGhost.png" class="BusterGhost"></a>
                    <span class="game-name">BusterGhost</span>
                </div>
            </div>
            <div class="column">
                <div class="game">
                    <a href="./Games/2048/2048.html"><img src="./Image/2048.png" alt="2048" data-original-src="./Image/2048.png" class="Lu2048"></a>
                    <span class="game-name">2048</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="column">
                <div class="game">
                    <a href="./Games/IndiannaDungeon/index.html"><img src="./Image/IndiannaDungeon.png" alt="IndiannaDungeon" data-original-src="./Image/IndiannaDungeon.png" class="IndiannaDungeon"></a>
                    <span class="game-name">IndiannaDungeon</span>
                </div>
            </div>
            <div class="column">
                <div class="game">
                    <a href="#"><img src="./Image/Bagger288.jpg" alt="Bagger288" data-original-src="./Image/Bagger288.jpg" class="Bagger288"></a>
                    <span class="game-name">Bagger288</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="column">
                <div class="game">
                    <a href="./Games/AimTrainer/index.html"><img src="./Image/AimTrainer.jpg" alt="AimTrainer" data-original-src="./Image/AimTrainer.jpg" class="AimTrainer"></a>
                    <span class="game-name">AimTrainer</span>
                </div>
            </div>
        </div>
    </div>

    <a href="highscore.html"><button id="btnHighScore" class="highscore-btn">HighScore</button></a>


    <div id="disconnectForm" class="disconnect hidden">
        <div class="center">
            <h2 class="form-title">Disconnect</h2>
            <div class="form-holder">
                <p>You are already connected !</p>
            </div>
            <button id="btnDisconnect" class="submit-btn">Disconnect</button>
        </div>
    </div>

    <div id="loginForm" class="form-structor">
        <div class="signup hidden">
            <h2 class="form-title" id="signup">Sign up</h2>
            <div class="form-holder">
                <input type="text" id="signupPseudo" class="input" placeholder="Pseudo" />
                <input type="text" id="signupSurName" class="input" placeholder="Surname" />
                <input type="text" id="signupFirstName" class="input" placeholder="Firstname" />
                <input type="password" id="signupPass" class="input" placeholder="Password" />
                <p class="error" id="signupError"></p>
            </div>
            <button id="btnSignUp" class="submit-btn">Sign up</button>
            <div class="buttons-container">
                <button id="SignLogIn" class="sendTo-btn">Log in</button>
            </div>
        </div>
        <div class="login">
            <div class="center">
                <h2 class="form-title" id="login">Log in</h2>
                <div class="form-holder">
                    <input type="text" id="LogInPseudo" class="input" placeholder="Pseudo" />
                    <input type="password" id="loginPass" class="input" placeholder="Password" />
                    <p class="error" id="loginError"></p>
                </div>
                <button id="btnLogin" class="submit-btn">Log in</button>
                <div class="buttons-container">
                    <button id="LogSignUp" class="sendTo-btn">Sign up</button>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
